<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>سورة الفلق</title>
  <style>
    body {
      background-color: lavender;
      font-family: 'Arial', sans-serif;
      color: darkblue;
      padding: 30px;
      text-align: center;
    }

    h1 {
      color: darkgreen;
      font-size: 32px;
    }

    p {
      font-size: 24px;
      line-height: 2;
      color: darkred;
    }

    .bismillah {
      color: navy;
      font-weight: bold;
    }

    .ayah {
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>سورة الفلق</h1>
  <p class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
  <p class="ayah">قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ</p>
  <p class="ayah">مِن شَرِّ مَا خَلَقَ</p>
  <p class="ayah">وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ</p>
  <p class="ayah">وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ</p>
  <p class="ayah">وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ</p>
</body>
</html>
